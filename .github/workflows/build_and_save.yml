name: build j2me and save

on:
  push:
    tags:
      - '*'
      
  workflow_dispatch:
    inputs:
      j2mesrc:
        description: 'J2me src dir'
        default: '/home/runner/work/buildJ2me/buildJ2me/J2meSrc/pmjparser'
      artifactdir:
        description: 'Directory j2me compile jar'
        default: '/home/runner/work/buildJ2me/buildJ2me/J2meSrc/pmjparser'
# ${{ github.event.inputs.j2mesrc}}

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 8
      uses: actions/setup-java@v1
      with:
        java-version: 8
        
  #  - uses: cedx/setup-ant@main
#      with:
#          optional-tasks: true
#    - run: ant -version

#    - name: Setup Android SDK
#      uses: android-actions/setup-android@v3
    
    - name: Get short SHA
      id: slug
      run: echo "::name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - name: build samples
      run: |
               cd ${{ github.event.inputs.j2mesrc}}
               sudo ls -l
               sudo dpkg --add-architecture i386
               sudo apt-get update
               sudo apt-get install libc6:i386 libncurses5:i386 libstdc++6:i386 libxt6:i386
               for x in `ls ../../bin`
               do
               chmod +x ../../bin/$x
               done
               sudo chmod +x ./build.sh
               ./build.sh
      
    - uses: actions/upload-artifact@v4
      with:
        name: J2me-build-${{ steps.slug.outputs.sha8 }}
        path: |
                  ${{ github.event.inputs.artifactdir}}/FontViewer.jar
                  archive: false
