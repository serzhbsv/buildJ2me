name: build artifacts

on:
  push:
    tags:
      - '*'
      
  workflow_dispatch:
    inputs:
      j2mesrc:
        description: 'J2me src dir'
        default: 'J2meSrc/Nescube'
      artifactdir:
        description: 'Directory j2me compile jar'
        default: 'J2meSrc/Nescube'
# ${{ github.event.inputs.j2mesrc}}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 8
      uses: actions/setup-java@v1
      with:
        java-version: 8
        
  #  - uses: cedx/setup-ant@main
#      with:
#          optional-tasks: true
#    - run: ant -version

#    - name: Setup Android SDK
#      uses: android-actions/setup-android@v3
    
    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - name: build samples
      run: |
               sudo ls -l
               cd ${{ github.event.inputs.j2mesrc}}
               sudo chmod +x ./build.sh
               ./build.sh
      
    - uses: actions/upload-artifact@v4
      with:
        name: J2me-build-${{ steps.slug.outputs.sha8 }}
        path: |
                  ${{ github.event.inputs.artifactdir}}
